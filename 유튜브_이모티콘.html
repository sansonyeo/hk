<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>유튜브 이모티콘</title>
<style>
  :root{
    --bg:#0f0f0f;
    --panel:#0f0f0f;
    --band:#282828;
    --field:#121212;
    --line:#303030;
    --text:#f1f1f1;
    --muted:#aaaaaa;
    --hover:#ffffff1f;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:"Roboto","Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",
                "Segoe UI Emoji","Noto Color Emoji",sans-serif;
    font-size:14px;
    -webkit-font-smoothing:antialiased;
  }
  .picker{
    display:flex;
    flex-direction:column;
    height:100vh;
    background:var(--panel);
  }

  /* 검색 */
  .search{padding:10px 14px 4px}
  .search input{
    width:100%;
    height:40px;
    padding:0 14px;
    background:var(--field);
    color:var(--text);
    border:1px solid var(--line);
    border-radius:8px;
    font:inherit;
    outline:none;
  }
  .search input::placeholder{color:#8b8b8b}
  .search input:focus{border-color:#3ea6ff}

  /* 카테고리 탭 */
  .tabs{
    display:flex;
    justify-content:center;
    gap:6px;
    padding:6px 14px 8px;
  }
  .tab{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    width:34px;
    height:30px;
    border:0;
    background:transparent;
    color:var(--muted);
    border-radius:4px;
    cursor:pointer;
    padding:0;
  }
  .tab:hover{background:var(--hover);color:var(--text)}
  .tab.on{color:var(--text)}
  .tab.on::after{
    content:"";
    position:absolute;
    left:50%;
    bottom:-5px;
    transform:translateX(-50%);
    width:22px;
    height:2px;
    background:var(--text);
    border-radius:2px;
  }
  .tab svg{width:20px;height:20px;display:block}

  /* 목록 */
  .list{
    position:relative;   /* 섹션 offsetTop 의 기준점 */
    flex:1;
    overflow-y:auto;
    overscroll-behavior:contain;
    padding-bottom:16px;
  }
  .list::-webkit-scrollbar{width:12px}
  .list::-webkit-scrollbar-thumb{
    background:#5c5c5c;border-radius:6px;
    border:3px solid var(--bg);background-clip:padding-box;
  }
  .list::-webkit-scrollbar-thumb:hover{background:#8a8a8a;background-clip:padding-box;border:3px solid var(--bg)}

  .head{
    position:sticky;top:0;z-index:2;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    background:var(--band);
    padding:6px 14px;
    font-size:13px;
    font-weight:500;
    letter-spacing:.4px;
    color:var(--text);
  }
  .head .toggle{
    border:1px solid #4a4a4a;
    background:transparent;
    color:var(--muted);
    font:inherit;
    font-size:11px;
    font-weight:500;
    letter-spacing:0;
    padding:2px 9px;
    border-radius:11px;
    cursor:pointer;
  }
  .head .toggle:hover{background:var(--hover);color:var(--text)}
  .head .toggle.on{
    background:var(--text);
    border-color:var(--text);
    color:#0f0f0f;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(48px,1fr));
    gap:2px;
    padding:6px 10px 10px;
  }
  .cell{
    aspect-ratio:1;
    display:flex;
    align-items:center;
    justify-content:center;
    border:0;
    background:transparent;
    border-radius:6px;
    cursor:pointer;
    padding:0;
    font-size:26px;
    line-height:1;
    color:var(--text);
  }
  .cell:hover{background:var(--hover)}
  .cell:focus-visible{outline:2px solid #3ea6ff;outline-offset:-2px}

  /* 이름 표시 모드: 타일 + :코드: 를 가로로 나열 */
  .grid.named{grid-template-columns:repeat(auto-fill,minmax(252px,1fr))}
  .grid.named .cell{
    aspect-ratio:auto;
    height:40px;
    justify-content:flex-start;
    gap:9px;
    padding:0 8px;
  }
  .grid.named .code{
    font-family:ui-monospace,SFMono-Regular,Consolas,"D2Coding",monospace;
    font-size:12px;
    color:var(--muted);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .grid.named .cell:hover .code{color:var(--text)}
  .grid.named .uch{
    width:32px;
    flex:none;
    text-align:center;
    font-size:24px;
    line-height:32px;
  }

  /* 유튜브(커스텀) 이모티콘 이미지 */
  .eimg{
    width:32px;height:32px;
    object-fit:contain;
    image-rendering:auto;
    flex:none;
  }
  .eimg.tiny{width:24px;height:24px;vertical-align:-6px}

  /* 이미지가 없을 때 쓰는 색상 타일 */
  .blob{
    width:32px;height:32px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:700;
    letter-spacing:-.3px;
    color:#0b0b0b;
    text-transform:uppercase;
    box-shadow:inset 0 -3px 0 rgba(0,0,0,.18);
  }

  .empty{
    padding:40px 14px;
    text-align:center;
    color:var(--muted);
  }

  /* 모아둔 이모티콘 바 — 클릭할수록 여기에 쌓이고 클립보드도 같이 갱신된다 */
  .tray{
    flex:none;
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 12px;
    background:var(--band);
    border-top:1px solid var(--line);
  }
  .tray .buf{
    flex:1;
    min-width:0;
    max-height:56px;
    overflow-y:auto;
    font-size:17px;
    line-height:1.5;
    white-space:pre-wrap;
    word-break:break-all;
    color:var(--text);
  }
  .tray .buf .c{
    font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
    font-size:13px;
    color:#9ecbff;
  }
  .tray .n{flex:none;font-size:12px;color:var(--muted)}
  .tray button{
    flex:none;
    border:1px solid #4a4a4a;
    background:transparent;
    color:var(--muted);
    font:inherit;
    font-size:11px;
    padding:3px 10px;
    border-radius:11px;
    cursor:pointer;
  }
  .tray button:hover:not(:disabled){background:var(--hover);color:var(--text)}
  .tray button:disabled{opacity:.35;cursor:default}
  .tray.flash{background:#3a3a3a}
  /* 비어 있을 때 안내 문구 */
  .tray .buf:empty::before{
    content:"이모티콘을 클릭하면 여기에 쌓입니다";
    font-size:12px;
    color:#7a7a7a;
  }
  .fname{
    flex:none;
    width:150px;
    height:26px;
    padding:0 9px;
    background:var(--field);
    color:var(--text);
    border:1px solid #4a4a4a;
    border-radius:13px;
    font:inherit;
    font-size:12px;
    outline:none;
  }
  .fname::placeholder{color:#7a7a7a}
  .fname:focus{border-color:#3ea6ff}

  /* 저장 목록 팝업 */
  .modal{
    position:fixed;
    inset:0;
    background:#000000b8;
    display:none;
    align-items:center;
    justify-content:center;
    z-index:10;
  }
  .modal.on{display:flex}
  .panel{
    width:min(760px,92vw);
    max-height:82vh;
    display:flex;
    flex-direction:column;
    background:#212121;
    border:1px solid var(--line);
    border-radius:10px;
    overflow:hidden;
  }
  .phead{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 14px;
    background:var(--band);
    font-size:14px;
    font-weight:500;
    border-bottom:1px solid var(--line);
  }
  .phead button{
    border:1px solid #4a4a4a;
    background:transparent;
    color:var(--muted);
    font:inherit;
    font-size:11px;
    padding:3px 10px;
    border-radius:11px;
    cursor:pointer;
  }
  .phead button:hover{background:var(--hover);color:var(--text)}
  .plist{overflow-y:auto;padding:8px}
  .plist::-webkit-scrollbar{width:10px}
  .plist::-webkit-scrollbar-thumb{background:#5c5c5c;border-radius:5px;border:2px solid #212121;background-clip:padding-box}
  .row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px 8px;
    border-radius:8px;
  }
  .row:hover{background:#ffffff0f}
  .row .nm{
    flex:none;
    width:140px;
    font-size:13px;
    font-weight:500;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .row .pv{
    flex:1;
    min-width:0;
    font-size:17px;
    line-height:1.4;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .row .pv .c{
    font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
    font-size:13px;
    color:#9ecbff;
  }
  .row .at{flex:none;font-size:11px;color:#7a7a7a}
  .row button{
    flex:none;
    border:1px solid #4a4a4a;
    background:transparent;
    color:var(--muted);
    font:inherit;
    font-size:11px;
    padding:3px 10px;
    border-radius:11px;
    cursor:pointer;
  }
  .row button:hover{background:var(--hover);color:var(--text)}
  .pempty{padding:36px;text-align:center;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div class="picker">
  <div class="search">
    <input id="q" type="text" placeholder="이모티콘 검색" autocomplete="off" spellcheck="false">
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="list" id="list"></div>
  <div class="tray" id="tray">
    <div class="buf" id="buf"></div>
    <span class="n" id="cnt"></span>
    <input id="fname" class="fname" type="text" placeholder="저장 이름" autocomplete="off" spellcheck="false">
    <button id="save" title="이 이름으로 목록에 저장하고 txt 파일도 내려받기">저장</button>
    <button id="savelist" title="저장한 목록 보기">목록</button>
    <button id="undo" title="마지막 하나 취소">되돌리기</button>
    <button id="clear" title="모아둔 것 전부 비우기">비우기</button>
  </div>
</div>

<div class="modal" id="modal">
  <div class="panel">
    <div class="phead">
      <span>저장한 목록</span>
      <span class="n" id="mcnt"></span>
      <span style="flex:1"></span>
      <button id="mwipe" title="저장한 항목 전부 삭제">전체 삭제</button>
      <button id="mclose">닫기</button>
    </div>
    <div class="plist" id="plist"></div>
  </div>
</div>

const COLORS = {
  pink:'#ff5fa2', blue:'#3ea6ff', red:'#ff5b52', purple:'#a97bff',
  green:'#3fd25f', turquoise:'#2fd8c8', turqouise:'#2fd8c8',
  orange:'#ff9432', fuchsia:'#ff5fe0', yellow:'#ffd028',
  white:'#e8e8e8', teal:'#1fbfa8',
};

// 이름에서 색상 토큰을 찾아 타일 색을 정한다. 없으면 이름 해시로 색을 고른다.
const PALETTE = Object.values(COLORS);
function colorOf(name){
  for (const t of name.split('-')) if (COLORS[t]) return COLORS[t];
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
  return PALETTE[h % PALETTE.length];
}
// 색상 토큰을 뺀 나머지에서 두 글자를 뽑아 라벨로 쓴다.
function labelOf(name){
  const parts = name.split('-').filter(t => !COLORS[t]);
  if (parts.length >= 2) return parts[parts.length - 2][0] + parts[parts.length - 1][0];
  return (parts[0] || name).slice(0, 2);
}

// 실제 이모티콘 이미지가 있으면 <img>, 없으면 색상 타일을 만든다.
// 이미지 로딩이 실패하면(오프라인·URL 만료) 색상 타일로 되돌린다.
function blobTile(name){
  const d = document.createElement('span');
  d.className = 'blob';
  d.style.background = colorOf(name);
  d.textContent = labelOf(name);
  return d;
}
function tile(name){
  const url = DATA.imgs[name];
  if (!url) return blobTile(name);
  const img = document.createElement('img');
  img.className = 'eimg';
  img.src = url;
  img.alt = name;
  img.loading = 'lazy';
  img.draggable = false;
  img.onerror = () => img.replaceWith(blobTile(name));
  return img;
}

// 문자와 :코드: 는 빌드 시점에 짝지어져 있다 (items = [[문자, 코드], ...])
const SECTIONS = [
  {key:'유튜브', title:'유튜브', items: DATA.hk.map(n => ({type:'hk', name:n, code:n}))},
  ...DATA.cats.map(c => ({

];

const tabBtns = SECTIONS.map(s => {
  const b = document.createElement('button');
  b.className = 'tab';
  b.title = s.title;
  b.dataset.key = s.key;
  b.innerHTML = ICONS[s.key] || '';
  b.onclick = () => {
    // 검색 중이면 전체 목록으로 되돌린 뒤 이동한다
    if (qEl.value) { qEl.value = ''; render(''); }
    goTo(s.key);
  };
  tabsEl.appendChild(b);
  return b;
});

// 해당 섹션을 목록 맨 위로 올린다. .list 가 position:relative 라
// section.offsetTop 이 곧 목표 scrollTop 이 된다.
function goTo(key){
  const sec = document.getElementById('sec-' + key);
  if (!sec) return;
  listEl.scrollTop = sec.offsetTop;
  syncTab();
}

// 스크롤 위치에 해당하는 탭에 밑줄을 표시한다
function syncTab(){
  const top = listEl.scrollTop;
  let active = null;
  for (const b of tabBtns){
    const sec = document.getElementById('sec-' + b.dataset.key);
    if (sec && sec.offsetTop <= top + 4) active = b;
  }
  if (!active) active = tabBtns.find(b => document.getElementById('sec-' + b.dataset.key));
  for (const b of tabBtns) b.classList.toggle('on', b === active);
}
listEl.addEventListener('scroll', syncTab, {passive:true});

let showNames = false;

function render(q){
  // :face-blue-smiling: 처럼 콜론째 붙여넣어도 검색되게 한다
  q = q.trim().toLowerCase().replace(/^:+|:+$/g, '');
  listEl.innerHTML = '';
  let shown = 0;

  for (const s of SECTIONS){
    // 모든 이모티콘을 :코드: 로 검색한다. 카테고리명(인물·음식 …)으로도 걸린다.
    let items = s.items;
    if (q) items = s.title.includes(q) ? items : items.filter(i => i.code.includes(q));
    if (!items.length) continue;
    shown += items.length;

    // 스크롤 목적지는 sticky 헤더가 아니라 이 래퍼다.
    // (sticky 요소는 화면에 붙어 있어 scrollIntoView 가 이동을 건너뛴다)
    const sec = document.createElement('section');
    sec.className = 'sec';
    sec.id = 'sec-' + s.key;
    listEl.appendChild(sec);

    const h = document.createElement('div');
    h.className = 'head';
    const t = document.createElement('span');
    t.textContent = s.title;
    h.appendChild(t);
    // 유튜브에 붙여넣을 :코드: 를 함께 볼 수 있게 한다.
    // 헤더가 sticky 라 어느 섹션에 있든 토글이 항상 손에 닿는다.
    const tg = document.createElement('button');
    tg.className = 'toggle' + (showNames ? ' on' : '');
    tg.textContent = ':코드: 표시';
    tg.onclick = () => { showNames = !showNames; render(qEl.value); goTo(s.key); };
    h.appendChild(tg);
    sec.appendChild(h);

    const named = showNames;
    const g = document.createElement('div');
    g.className = named ? 'grid named' : 'grid';
    for (const it of items){
      const c = document.createElement('button');
      c.className = 'cell';
      if (it.type === 'hk'){
        const code = ':' + it.name + ':';
        c.title = code;
        c.dataset.copy = code;
        c.appendChild(tile(it.name));
        if (named){
          const s2 = document.createElement('span');
          s2.className = 'code';
          s2.textContent = code;
          c.appendChild(s2);
        }
      } else {
        // 유니코드 이모지는 문자 자체를 복사한다 (어디에나 붙여넣을 수 있다)
        c.title = ':' + it.code + ':  ' + it.ch;
        c.dataset.copy = it.ch;
        if (named){
          const u = document.createElement('span');
          u.className = 'uch';
          u.textContent = it.ch;
          c.appendChild(u);
          const s2 = document.createElement('span');
          s2.className = 'code';
          s2.textContent = ':' + it.code + ':';
          c.appendChild(s2);
        } else {
          c.textContent = it.ch;
        }
      }
      g.appendChild(c);
    }
    sec.appendChild(g);
  }

  if (!shown){
    const e = document.createElement('div');
    e.className = 'empty';
    e.textContent = '검색 결과가 없습니다';
    listEl.appendChild(e);
  }
  syncTab();
}

// ── 연속 클릭 누적 ────────────────────────────────────────────
// 클릭할 때마다 buf 에 쌓고, 클립보드에는 항상 "쌓인 전체"를 넣는다.
// (브라우저에서 시스템 클립보드를 읽는 건 권한 문제로 막히므로 여기서 직접 들고 있는다)
const buf = [];

function writeClipboard(text){
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).catch(() => legacyCopy(text));
  } else {
    legacyCopy(text);
  }
}
// clipboard API 가 막힌 환경(구형 브라우저 등)용 대체 경로
function legacyCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('readonly', '');
  ta.style.cssText = 'position:fixed;top:-1000px;opacity:0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); } catch (e) {}
  ta.remove();
}

// 유튜브 이모티콘은 이미지로, 유니코드는 문자 그대로 — 붙여넣었을 때 모습에 가깝게.
// 트레이와 저장목록 팝업이 같이 쓴다.
function paint(el, items){
  el.innerHTML = '';
  for (const t of items){
    const name = t.replace(/^:|:$/g, '');
    if (DATA.imgs[name]){
      const img = document.createElement('img');
      img.className = 'eimg tiny';
      img.src = DATA.imgs[name];
      img.alt = t;
      img.title = t;
      el.appendChild(img);
    } else {
      const sp = document.createElement('span');
      if (/^:.+:$/.test(t)) sp.className = 'c';
      sp.textContent = t;
      sp.title = t;
      el.appendChild(sp);
    }
  }
}

let flashTimer;
function syncTray(){
  const text = buf.join('');
  cntEl.textContent = buf.length ? buf.length + '개' : '';
  saveEl.disabled = undoEl.disabled = clearEl.disabled = !buf.length;

  paint(bufEl, buf);
  bufEl.scrollTop = bufEl.scrollHeight;

  if (buf.length){
    trayEl.classList.add('flash');
    clearTimeout(flashTimer);
    flashTimer = setTimeout(() => trayEl.classList.remove('flash'), 160);
  }
  return text;
}

listEl.addEventListener('click', e => {
  const cell = e.target.closest('.cell');
  if (!cell) return;
  buf.push(cell.dataset.copy);
  writeClipboard(syncTray());
});

undoEl.onclick = () => { buf.pop(); writeClipboard(syncTray()); };
clearEl.onclick = () => { buf.length = 0; writeClipboard(syncTray()); };

// ── 저장 목록 ─────────────────────────────────────────────────
// 저장하면 (1) 이 브라우저에 목록으로 남고 (2) txt 파일로도 내려받는다.
const LS_KEY = 'ytemoji.saves';
const MAX_SAVES = 300;

function loadSaves(){
  try { const v = JSON.parse(localStorage.getItem(LS_KEY)); return Array.isArray(v) ? v : []; }
  catch (e) { return []; }
}
function storeSaves(list){
  try { localStorage.setItem(LS_KEY, JSON.stringify(list.slice(0, MAX_SAVES))); }
  catch (e) {}   // 용량 초과·프라이버시 모드 등에서는 목록만 못 남고 나머지는 정상 동작
}
function now(){
  const d = new Date(), p = n => String(n).padStart(2, '0');
  return {
    stamp: '' + d.getFullYear() + p(d.getMonth()+1) + p(d.getDate()) + '_' + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds()),
    label: d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()),
  };
}
// 윈도우 파일명에 못 쓰는 문자를 걸러낸다
const safeName = s => s.replace(/[\\/:*?"<>|]/g, '_').replace(/\s+/g, ' ').trim().slice(0, 80);

function download(name, text){
  const url = URL.createObjectURL(new Blob([text], {type:'text/plain;charset=utf-8'}));
  const a = document.createElement('a');
  a.href = url;
  a.download = name + '.txt';
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

saveEl.onclick = () => {
  if (!buf.length) return;
  const t = now();
  const typed = fnameEl.value.trim();
  const name = typed || '이모티콘_' + t.stamp;

  const list = loadSaves();
  list.unshift({ name: name, items: buf.slice(), at: t.label });
  storeSaves(list);

  download(safeName(name) || '이모티콘_' + t.stamp, buf.join(''));
  renderSaves();
};

function renderSaves(){
  const list = loadSaves();
  mcntEl.textContent = list.length ? list.length + '개' : '';
  plistEl.innerHTML = '';

  if (!list.length){
    const e = document.createElement('div');
    e.className = 'pempty';
    e.textContent = '저장한 내용이 없습니다. 이모티콘을 모아서 [저장]을 누르세요.';
    plistEl.appendChild(e);
    return;
  }

  list.forEach((s, idx) => {
    const row = document.createElement('div');
    row.className = 'row';

    const nm = document.createElement('div');
    nm.className = 'nm';
    nm.textContent = s.name;
    nm.title = s.name;
    row.appendChild(nm);

    const pv = document.createElement('div');
    pv.className = 'pv';
    paint(pv, s.items || []);
    pv.title = (s.items || []).join('');
    row.appendChild(pv);

    const at = document.createElement('span');
    at.className = 'at';
    at.textContent = s.at || '';
    row.appendChild(at);

    const cp = document.createElement('button');
    cp.textContent = '복사';
    cp.onclick = () => { writeClipboard((s.items || []).join('')); closeModal(); };
    row.appendChild(cp);

    const dl = document.createElement('button');
    dl.textContent = '파일';
    dl.title = 'txt 파일로 다시 내려받기';
    dl.onclick = () => download(safeName(s.name) || '이모티콘', (s.items || []).join(''));
    row.appendChild(dl);

    const rm = document.createElement('button');
    rm.textContent = '삭제';
    rm.onclick = () => {
      const cur = loadSaves();
      cur.splice(idx, 1);
      storeSaves(cur);
      renderSaves();
    };
    row.appendChild(rm);

    plistEl.appendChild(row);
  });
}

function openModal(){ renderSaves(); modalEl.classList.add('on'); }
function closeModal(){ modalEl.classList.remove('on'); }

listBtn.onclick = openModal;
mcloseEl.onclick = closeModal;
modalEl.onclick = e => { if (e.target === modalEl) closeModal(); };   // 바깥 클릭으로 닫기
mwipeEl.onclick = () => { storeSaves([]); renderSaves(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

qEl.addEventListener('input', () => render(qEl.value));
syncTray();
render('');
</script>
</body>
</html>
